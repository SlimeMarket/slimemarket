  <script>
    window.__PATH__ = window.location.pathname;
    // .B — read the real ids from the server-served /config.js
    // (window.SLIME_CONFIG).
    // the old hardcoded fallback here was the PREVIOUS Circle account's
    // app id. If CIRCLE_APP_ID was ever unset the browser silently drove UCW
    // against a dead app id. Fail loudly instead: no app id → no UCW, and the
    // sign-in screen reports it rather than half-working.
    window.CIRCLE_APP_ID = (window.SLIME_CONFIG && window.SLIME_CONFIG.circleAppId) || '';
    if (!window.CIRCLE_APP_ID) {
      console.error('[config] CIRCLE_APP_ID is not set — UCW sign-in/PIN flows will fail. Set it in the server env.');
    }
    (function () {
      // Force real Circle SDK flow even on localhost — Turnstile disabled (backend skips in dev).
      // .B4: IS_LOCAL stays false — the browser always runs the REAL Circle
      // flow. Mock/dev behavior is controlled SERVER-SIDE by CIRCLE_PAYMENTS_MOCK
      // / FORCE_REAL_UCW (.A1), and Playwright automation authenticates via
      // POST /api/auth/dev-login (never through this flag).
      window.TURNSTILE_SITE_KEY = (window.SLIME_CONFIG && window.SLIME_CONFIG.turnstileSiteKey) || '';
      window.IS_LOCAL = false;
      // Phase 4.2 — non-custodial checkout flag. Default false (legacy custodial
      // path). The FE fetches /api/health on boot to detect the server-side
      // ONCHAIN_WALLET_FUNDS flag and updates this at runtime (see app.jsx boot).
      window.ONCHAIN_FUNDS = false;
    })();
  </script>
