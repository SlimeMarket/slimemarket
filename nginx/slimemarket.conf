# SlimeMarket — Nginx reverse proxy + SSL
# Place this in /etc/nginx/sites-available/slimemarket
# Then: ln -s /etc/nginx/sites-available/slimemarket /etc/nginx/sites-enabled/
#
# Requires: certbot ( Let's Encrypt ) for SSL.
# Before first deploy, run: certbot --nginx -d your-domain.com -d www.your-domain.com

# Rate limit zone (1MB holds ~16k IPs)
limit_req_zone $binary_remote_addr zone=slimemarket:10m rate=20r/s;
limit_req_status 429;

# Upstream Next.js app (Docker binds to 127.0.0.1:3000)
upstream slimemarket_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;  # catch-all; tighten to your domain after certbot

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # SSL handled by certbot (paths injected automatically)
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;

    # Security headers (aligned with next.config.ts)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Logging
    access_log /var/log/nginx/slimemarket.access.log;
    error_log  /var/log/nginx/slimemarket.error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # NOTE: /_next/static/ is deliberately NOT aliased to a host directory.
    # The app runs in Docker and serves its own immutable chunks from
    # /app/.next/static INSIDE the container. The previous config aliased this
    # path to /var/www/slimemarket/.next/static, which nothing ever creates (the
    # deploy script does not copy it) — so every JS/CSS chunk 404'd and the site
    # rendered blank. Falling through to `location /` proxies them to Next.js,
    # which already sets `Cache-Control: public, max-age=31536000, immutable`
    # on /_next/static itself.

    # Proxy everything else to Next.js
    location / {
        limit_req zone=slimemarket burst=40 nodelay;

        proxy_pass http://slimemarket_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (Next.js dev HMR — not needed in production,
        # but harmless and future-proof)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering: disable for streaming responses (health, webhooks)
        proxy_buffering off;
    }

    # Health endpoint — allow monitoring services with lighter rate limit
    location /api/health {
        limit_req zone=slimemarket burst=100 nodelay;
        proxy_pass http://slimemarket_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Webhook endpoints — larger body size, no rate limit (Circle pushes)
    location /api/webhooks/ {
        client_max_body_size 5M;
        proxy_pass http://slimemarket_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
